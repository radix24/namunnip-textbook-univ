<article class="card q-card" id="card-e34-mux7seg-ex" data-kind="예제" data-std="전전34-04-04">
  <header class="card-head"><span class="no"></span><h2>핀 수 절약</h2><span class="kind">직접 vs 다중</span></header>
  <div class="q-body">
    <section class="q-sec">
      <h3>출발점</h3>
      <p>다중 구동의 핀 절약을 계산합니다(4.4절).</p>
    </section>

    <div class="q-strategy">
      <span class="lb">문제 해결 전략 · 핀 수 비교</span>
      <ol>
        <li>4자리, 자리당 8개 세그먼트(소수점 포함).</li>
        <li>직접: 4 × 8 + 공통.</li>
        <li>다중: 8 + 4.</li>
      </ol>
    </div>

    <p class="q-prob">두 방식의 신호 핀 수는?</p>

    <section class="q-sec">
      <h3>풀이</h3>
      <ol class="q-proof">
        <li><div>직접 32개(공통은 전원에).</div><span class="q-why">계산.</span></li>
        <li><div>다중 12개.</div><span class="q-why">계산.</span></li>
        <li class="q-end"><div>20개 절약, 대신 주사 논리 필요.</div><span class="q-why">절충.</span></li>
      </ol>
    </section>

    <section class="q-meaning">
      <h3>의미</h3>
      <p>FPGA 보드의 7세그먼트가 대부분 다중 구동인 이유이다.</p>
    </section>

    <section class="q-check">
      <h3>검산</h3>
      <p>8 + 4 = 12.</p>
    </section>
  </div>
</article>
