<article class="card q-card" id="card-p15-u04-practice" data-kind="연습" data-std="물리15-04-01">
  <header class="card-head"><span class="no"></span><h2>전공 설계 연습 문제</h2><span class="kind">문제 1 · 적용 · 힌트 2단계</span></header>
  <div class="q-body">
    <p>혼자 풀고, 막히면 힌트 1 → 힌트 2 → 풀이 순서로 여세요.</p>
    <ol class="q-exlist">
      <li>
        <p class="q-prob"><span class="q-tag">적용</span>천체물리 대학원을 목표로 할 때 학부에서 꼭 들어야 할 물리 과목 세 개와 그 까닭을 써라. <span class="mono small dim">[04-01]</span></p>
        <details><summary>힌트 1</summary><p>별의 내부, 복사, 우주론.</p></details>
        <details><summary>힌트 2</summary><p>통계물리, 전자기학, 양자역학.</p></details>
        <details class="q-sol"><summary>풀이</summary>
          <p>예: 통계물리(별 내부와 복사의 통계), 전자기학(복사와 관측), 양자역학(스펙트럼과 원자 물리). 천문우주학과 과목(천체물리학)과 함께 듣는다.</p>
        </details>
      </li>
    </ol>
  </div>
</article>
